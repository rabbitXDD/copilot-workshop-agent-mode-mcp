<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card" aria-label="待辦清單">
        <header class="todo-header">
          <h1>待辦清單</h1>
        </header>

        <div class="todo-input-row">
          <input
            id="todoInput"
            type="text"
            maxlength="200"
            placeholder="新增待辦事項"
            aria-label="新增待辦事項"
          />
          <button id="addBtn" type="button">新增</button>
        </div>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>

        <div class="todo-footer">
          <span id="remainingCount">未完成: 0 項</span>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
