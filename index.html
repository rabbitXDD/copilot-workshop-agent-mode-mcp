<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card" aria-label="待辦清單">
        <header class="todo-header">
          <h1>待辦清單</h1>
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            aria-label="切換深色模式"
          >
            <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
            <span class="theme-toggle-label">深色模式</span>
          </button>
        </header>

        <div class="todo-input-row">
          <input
            id="todoInput"
            type="text"
            maxlength="200"
            placeholder="新增待辦事項"
            aria-label="新增待辦事項"
          />
          <button id="addBtn" type="button">新增</button>
        </div>

        <div class="filter-group" role="group" aria-label="待辦篩選">
          <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">
            全部
          </button>
          <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">
            未完成
          </button>
          <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">
            已完成
          </button>
        </div>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>

        <div class="todo-footer">
          <span id="remainingCount">未完成: 0 項</span>
          <button
            id="clearCompletedBtn"
            class="clear-completed-btn"
            type="button"
            aria-label="清除所有已完成項目"
          >
            清除已完成
          </button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
